<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <title>Harita Görünüm Geçişi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      touch-action: none;
    }

    .slider-track {
      display: flex;
      width: 200%;
      height: 100%;
      will-change: transform;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .no-transition {
      transition: none !important;
    }

    .slide {
      width: 50%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .map-zoom-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 0 0;
      will-change: transform;
    }

    .map-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      display: block;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body class="bg-slate-950">

  <main class="w-full h-full relative overflow-hidden">

    <div id="sliderTrack" class="slider-track">

      <div class="slide" id="slide0">
        <div class="map-zoom-wrapper" id="zoomWrapper0">
          <img
            id="mapImg0"
            src="1.jpg"
            alt="Renksiz Harita"
            class="map-image"
            onerror="handleImgError(this, '1.jpg')"
          />
        </div>
      </div>

      <div class="slide" id="slide1">
        <div class="map-zoom-wrapper" id="zoomWrapper1">
          <img
            id="mapImg1"
            src="2.jpg"
            alt="Renkli Uydu Haritası"
            class="map-image"
            onerror="handleImgError(this, '2.jpg')"
          />
        </div>
      </div>

    </div>

  </main>

  <script>
    const sliderTrack = document.getElementById('sliderTrack');
    const slides = [
      { wrapper: document.getElementById('zoomWrapper0'), img: document.getElementById('mapImg0') },
      { wrapper: document.getElementById('zoomWrapper1'), img: document.getElementById('mapImg1') }
    ];

    let currentIndex = 0;

    const zoomState = [
      { scale: 1, translateX: 0, translateY: 0 },
      { scale: 1, translateX: 0, translateY: 0 }
    ];

    let isInteracting = false;
    let startX = 0;
    let startY = 0;
    let initialPinchDistance = 0;
    let initialScale = 1;
    let isPinching = false;
    let swipeDeltaX = 0;
    let lastTapTime = 0;
    let isDraggingImage = false;
    let lastTapX = 0;
    let lastTapY = 0;

    window.addEventListener('contextmenu', e => e.preventDefault());

    function handleImgError(img, name) {
      console.warn('Resim bulunamadi:', name, '— yol:', img.src);
    }

    function updateSliderPosition(extraOffsetPx = 0) {
      const windowWidth = window.innerWidth;
      const basePercent = -currentIndex * 50;
      const extraPercent = (extraOffsetPx / (windowWidth * 2)) * 100;
      sliderTrack.style.transform = `translateX(${basePercent + extraPercent}%)`;
    }

    function applyTransform(index) {
      const state = zoomState[index];
      slides[index].wrapper.style.transform =
        `translate(${state.translateX}px, ${state.translateY}px) scale(${state.scale})`;
    }

    function clampTranslation(index) {
      const state = zoomState[index];
      if (state.scale <= 1) {
        state.scale = 1;
        state.translateX = 0;
        state.translateY = 0;
        return;
      }
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;
      const maxTransX = (windowW * (state.scale - 1)) / 2;
      const maxTransY = (windowH * (state.scale - 1)) / 2;
      state.translateX = Math.min(Math.max(state.translateX, -maxTransX), maxTransX);
      state.translateY = Math.min(Math.max(state.translateY, -maxTransY), maxTransY);
    }

    function getDistance(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function handleDoubleTap(x, y) {
      const state = zoomState[currentIndex];
      const wrapper = slides[currentIndex].wrapper;
      wrapper.style.transition = 'transform 0.3s ease';

      if (state.scale > 1) {
        state.scale = 1;
        state.translateX = 0;
        state.translateY = 0;
      } else {
        state.scale = 2.5;
        state.translateX = (window.innerWidth / 2 - x) * 0.8;
        state.translateY = (window.innerHeight / 2 - y) * 0.8;
        clampTranslation(currentIndex);
      }

      applyTransform(currentIndex);
      setTimeout(() => { wrapper.style.transition = 'none'; }, 300);
    }

    window.addEventListener('touchstart', (e) => {
      const touches = e.touches;

      if (touches.length === 1) {
        const now = Date.now();
        const x = touches[0].clientX;
        const y = touches[0].clientY;
        const near = Math.hypot(x - lastTapX, y - lastTapY) < 30;

        if (now - lastTapTime < 300 && near) {
          handleDoubleTap(x, y);
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;
        lastTapX = x;
        lastTapY = y;
      }

      if (touches.length === 2) {
        isPinching = true;
        isInteracting = false;
        initialPinchDistance = getDistance(touches[0], touches[1]);
        initialScale = zoomState[currentIndex].scale;
        sliderTrack.classList.add('no-transition');
      } else if (touches.length === 1) {
        isInteracting = true;
        isPinching = false;
        startX = touches[0].clientX;
        startY = touches[0].clientY;
        swipeDeltaX = 0;
        isDraggingImage = zoomState[currentIndex].scale > 1;
        if (!isDraggingImage) {
          sliderTrack.classList.add('no-transition');
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const touches = e.touches;

      if (isPinching && touches.length === 2) {
        e.preventDefault();
        const newDist = getDistance(touches[0], touches[1]);
        if (initialPinchDistance > 0) {
          const factor = newDist / initialPinchDistance;
          let newScale = Math.min(Math.max(initialScale * factor, 1), 6);
          zoomState[currentIndex].scale = newScale;
          clampTranslation(currentIndex);
          applyTransform(currentIndex);
        }
      } else if (isInteracting && touches.length === 1) {
        const currentX = touches[0].clientX;
        const currentY = touches[0].clientY;
        const deltaX = currentX - startX;
        const deltaY = currentY - startY;

        if (zoomState[currentIndex].scale > 1) {
          e.preventDefault();
          zoomState[currentIndex].translateX += deltaX;
          zoomState[currentIndex].translateY += deltaY;
          clampTranslation(currentIndex);
          applyTransform(currentIndex);
          startX = currentX;
          startY = currentY;
        } else {
          swipeDeltaX = deltaX;
          updateSliderPosition(swipeDeltaX);
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        isPinching = false;
        initialPinchDistance = 0;
      }

      if (isInteracting && !isDraggingImage && zoomState[currentIndex].scale === 1) {
        isInteracting = false;
        sliderTrack.classList.remove('no-transition');

        const threshold = window.innerWidth * 0.2;
        if (swipeDeltaX < -threshold && currentIndex < 1) {
          currentIndex = 1;
        } else if (swipeDeltaX > threshold && currentIndex > 0) {
          currentIndex = 0;
        }
        updateSliderPosition(0);
      } else if (isInteracting) {
        isInteracting = false;
      }
    });

    let isMouseDown = false;
    let mouseStartX = 0;
    let mouseStartY = 0;

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
      swipeDeltaX = 0;
      if (zoomState[currentIndex].scale === 1) {
        sliderTrack.classList.add('no-transition');
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const deltaX = e.clientX - mouseStartX;
      const deltaY = e.clientY - mouseStartY;

      if (zoomState[currentIndex].scale > 1) {
        zoomState[currentIndex].translateX += deltaX;
        zoomState[currentIndex].translateY += deltaY;
        clampTranslation(currentIndex);
        applyTransform(currentIndex);
        mouseStartX = e.clientX;
        mouseStartY = e.clientY;
      } else {
        swipeDeltaX = deltaX;
        updateSliderPosition(swipeDeltaX);
      }
    });

    window.addEventListener('mouseup', () => {
      if (!isMouseDown) return;
      isMouseDown = false;
      if (zoomState[currentIndex].scale === 1) {
        sliderTrack.classList.remove('no-transition');
        const threshold = window.innerWidth * 0.15;
        if (swipeDeltaX < -threshold && currentIndex < 1) {
          currentIndex = 1;
        } else if (swipeDeltaX > threshold && currentIndex > 0) {
          currentIndex = 0;
        }
        updateSliderPosition(0);
      }
    });

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const state = zoomState[currentIndex];
      const zoomFactor = e.deltaY < 0 ? 1.2 : 0.8;
      state.scale = Math.min(Math.max(state.scale * zoomFactor, 1), 6);
      clampTranslation(currentIndex);
      applyTransform(currentIndex);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (zoomState[currentIndex].scale === 1) {
        if (e.key === 'ArrowRight' && currentIndex === 0) {
          currentIndex = 1;
          updateSliderPosition(0);
        } else if (e.key === 'ArrowLeft' && currentIndex === 1) {
          currentIndex = 0;
          updateSliderPosition(0);
        }
      }
    });

    window.addEventListener('resize', () => {
      clampTranslation(0);
      clampTranslation(1);
      applyTransform(0);
      applyTransform(1);
      updateSliderPosition(0);
    });
  </script>
</body>
</html>
